name: Trigger Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  call-claude-review:
    # Explicitly grant write access to pull requests for this run
    permissions:
      pull-requests: write
      contents: read
    # Points to your public central repository template
    uses: imsandeepreddy/central-actions/.github/workflows/claude-pr-review-template.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
